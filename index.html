<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strain Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e0e; --surface: #181818; --surface2: #1e1e1e;
      --border: #2a2a2a; --border-light: #222;
      --text: #f0f0f0; --text-muted: #777; --text-dim: #444;
      --accent: #c8f060;
      --sativa-bg: #1a2a0a; --sativa-text: #a8e060; --sativa-border: #4a7a10;
      --indica-bg: #0a1a2a; --indica-text: #60a8e0; --indica-border: #1060a8;
      --hibrida-bg: #2a1a0a; --hibrida-text: #e0a860; --hibrida-border: #a86010;
      --flavor-bg: #1a1030; --flavor-text: #a090e0; --flavor-border: #6050b0;
      --pos-bg: #0e2010; --pos-text: #70c070; --pos-border: #306030;
      --neg-bg: #2a0e0e; --neg-text: #e07070; --neg-border: #a03030;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    .app { max-width: 600px; margin: 0 auto; padding: 0 16px 80px; }
    .header { padding: 28px 0 0; margin-bottom: 24px; }
    .logo { font-family: 'DM Mono', monospace; font-size: 18px; color: var(--accent); letter-spacing: -0.5px; }
    .header-sub { font-size: 12px; color: var(--text-muted); margin-left: 10px; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab { padding: 10px 0; margin-right: 24px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .page { display: none; }
    .page.active { display: block; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
    .field input, .field textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.15s; }
    .field input:focus, .field textarea:focus { border-color: #444; }
    .field textarea { resize: vertical; min-height: 80px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .price-calc { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--accent); font-family: 'DM Mono', monospace; display: flex; align-items: center; justify-content: center; min-height: 42px; }
    .type-group { display: flex; gap: 8px; }
    .type-btn { flex: 1; padding: 9px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; text-align: center; transition: all 0.15s; }
    .type-btn.active.sativa { background: var(--sativa-bg); color: var(--sativa-text); border-color: var(--sativa-border); }
    .type-btn.active.indica { background: var(--indica-bg); color: var(--indica-text); border-color: var(--indica-border); }
    .type-btn.active.hibrida { background: var(--hibrida-bg); color: var(--hibrida-text); border-color: var(--hibrida-border); }
    .divider { border: none; border-top: 1px solid var(--border-light); margin: 20px 0; }
    .section-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; }
    .tags-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 5px 12px; border-radius: 20px; font-size: 12px; color: var(--text-muted); border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: all 0.15s; }
    .tag.flavor.selected { background: var(--flavor-bg); color: var(--flavor-text); border-color: var(--flavor-border); }
    .tag.positive.selected { background: var(--pos-bg); color: var(--pos-text); border-color: var(--pos-border); }
    .tag.negative.selected { background: var(--neg-bg); color: var(--neg-text); border-color: var(--neg-border); }
    .ratings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .rating-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .rating-item label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px; }
    .stars { display: flex; gap: 4px; flex-wrap: wrap; }
    .star-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); font-size: 11px; font-family: 'DM Mono', monospace; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; font-weight: 500; }
    .star-btn.active { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
    .overall-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; margin-top: 12px; }
    .overall-box .overall-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .overall-box .overall-val { font-size: 28px; font-family: 'DM Mono', monospace; color: var(--accent); font-weight: 500; margin-top: 4px; }
    .save-btn { width: 100%; margin-top: 20px; padding: 12px; background: var(--accent); color: #0e0e0e; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.15s; }
    .save-btn:hover { opacity: 0.88; }
    .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .entry-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .card-date { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-dim); white-space: nowrap; }
    .card-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
    .card-tag { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid; }
    .card-notes { font-size: 13px; color: var(--text-muted); margin-top: 10px; line-height: 1.5; border-top: 1px solid var(--border-light); padding-top: 10px; }
    .type-badge { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid; display: inline-block; }
    .card-ratings { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
    .card-rating-item { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-muted); }
    .card-rating-item span { color: var(--text); }
    .card-overall { font-size: 22px; font-family: 'DM Mono', monospace; color: var(--accent); font-weight: 500; margin-left: auto; }
    .delete-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 15px; padding: 2px 4px; transition: color 0.15s; line-height: 1; }
    .delete-btn:hover { color: #e07070; }
    .edit-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 15px; padding: 2px 4px; transition: color 0.15s; line-height: 1; }
    .edit-btn:hover { color: var(--accent); }
    .edit-banner { background: #1a1a0a; border: 1px solid #555510; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 12px; font-family: 'DM Mono', monospace; color: #d0d060; display: none; align-items: center; justify-content: space-between; }
    .cancel-edit-btn { background: none; border: 1px solid #555510; border-radius: 6px; padding: 4px 10px; font-size: 11px; color: #d0d060; cursor: pointer; font-family: 'DM Mono', monospace; }
    .stats-filter { display: flex; gap: 6px; margin-bottom: 20px; }
    .stats-pill { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; background: var(--surface); transition: all 0.15s; }
    .stats-pill.active { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
    .stat-card-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .stat-card-value { font-size: 28px; font-family: 'DM Mono', monospace; color: var(--text); font-weight: 500; }
    .stat-card-value span { font-size: 14px; color: var(--text-muted); margin-left: 4px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .ranking-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
    .ranking-item:last-child { border-bottom: none; }
    .ranking-name { font-size: 13px; color: var(--text); }
    .ranking-val { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--accent); }
    .empty { text-align: center; padding: 48px 0; color: var(--text-muted); font-size: 13px; }
    .empty span { display: block; font-size: 11px; color: var(--text-dim); margin-top: 6px; font-family: 'DM Mono', monospace; }
    .loading { text-align: center; padding: 32px 0; color: var(--text-dim); font-size: 12px; font-family: 'DM Mono', monospace; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #0e0e0e; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap; z-index: 100; }
    .toast.show { opacity: 1; }
    .count-badge { font-size: 10px; font-family: 'DM Mono', monospace; background: #222; border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px; color: var(--text-muted); margin-left: 6px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 320px; width: 90%; }
    .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .modal-btn.cancel { background: var(--surface2); color: var(--text-muted); }
    .modal-btn.confirm { background: #2a0e0e; color: #e07070; border-color: #a03030; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="logo">strain.log</span>
    <span class="header-sub">bumba meu b0ss</span>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-list" onclick="switchTab('list')">Todas as Strains</div>
    <div class="tab" id="tab-add" onclick="switchTab('add')">Nova Strain</div>
    <div class="tab" id="tab-stats" onclick="switchTab('stats')">Estatísticas</div>
  </div>

  <div class="page active" id="page-list">
    <div id="entries-list"><div class="loading">carregando...</div></div>
  </div>

  <div class="page" id="page-add">
    <div class="grid2">
      <div class="field"><label>Nome da Strain</label><input type="text" id="strain" placeholder="Ex: Blue Dream" /></div>
      <div class="field"><label>Coffeeshop</label><input type="text" id="shop" placeholder="Ex: Boerejongens" /></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Quantidade (g)</label><input type="number" id="qty" placeholder="0.0" step="0.1" oninput="calcPrice()" /></div>
      <div class="field"><label>Total pago (€)</label><input type="number" id="price" placeholder="0.00" step="0.01" oninput="calcPrice()" /></div>
      <div class="field"><label>Preço / g</label><div class="price-calc" id="price-per-g">—</div></div>
    </div>
    <div class="field">
      <label>Tipo</label>
      <div class="type-group">
        <div class="type-btn sativa" onclick="selectType(this,'Sativa')">Sativa</div>
        <div class="type-btn indica" onclick="selectType(this,'Indica')">Indica</div>
        <div class="type-btn hibrida" onclick="selectType(this,'Híbrida')">Híbrida</div>
      </div>
    </div>
    <hr class="divider">
    <div class="section-label">Top sabores</div>
    <div class="tags-grid" id="flavors"></div>
    <hr class="divider">
    <div class="section-label">Efeitos positivos</div>
    <div class="tags-grid" id="pos-effects"></div>
    <div class="section-label" style="margin-top:14px">Efeitos negativos</div>
    <div class="tags-grid" id="neg-effects"></div>
    <hr class="divider">
    <div class="section-label" style="margin-bottom:12px">Notas</div>
    <div class="ratings-grid">
      <div class="rating-item"><label>Aparência</label><div class="stars" id="r-aparencia"></div></div>
      <div class="rating-item"><label>Cheiro</label><div class="stars" id="r-cheiro"></div></div>
      <div class="rating-item"><label>Gosto</label><div class="stars" id="r-gosto"></div></div>
      <div class="rating-item"><label>Queima</label><div class="stars" id="r-queima"></div></div>
      <div class="rating-item" style="grid-column:1/-1"><label>Stoned</label><div class="stars" id="r-stoned"></div></div>
    </div>
    <div class="overall-box">
      <div class="overall-label">Overall</div>
      <div class="overall-val" id="overall-display">—</div>
    </div>
    <hr class="divider">
    <div class="field"><label>Comentários</label><textarea id="notes" placeholder="Anota suas impressões..."></textarea></div>
    <div class="edit-banner" id="edit-banner">
      <span>✏️ Editando entrada</span>
      <button class="cancel-edit-btn" onclick="cancelEdit()">Cancelar edição</button>
    </div>
    <button class="save-btn" id="save-btn" onclick="saveEntry()">Salvar Strain</button>
  </div>

  <div class="page" id="page-stats">
    <div class="stats-filter">
      <div class="stats-pill active" onclick="setStatsPeriod(this,'week')">Semana</div>
      <div class="stats-pill" onclick="setStatsPeriod(this,'month')">Mês</div>
      <div class="stats-pill" onclick="setStatsPeriod(this,'year')">Ano</div>
    </div>
    <div id="stats-content"><div class="loading">carregando...</div></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Apagar entrada?</h3>
    <p id="modal-strain-name"></p>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn confirm" onclick="confirmDelete()">Apagar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://mecbrpcqdzzifkuoxqkp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mIt2ZvHccNfA2CFdvGQEtw_ESH_Fl8K';

const flavors = ['Terra','Pinho','Madeira','Floral','Cítrico','Frutado','Doce','Hortelã','Erva','Queimado','Picante','Diesel','Químico','Tropical','Uva','Mirtilo','Baunilha','Lavanda'];
const posEffects = ['Relaxante','Criativo','Eufórico','Focado','Energético','Feliz','Sociável','Sonolento','Estimulante','Sedativo'];
const negEffects = ['Ansiedade','Boca seca','Olhos vermelhos','Paranoia','Tontura','Fome','Dor de cabeça','Lentidão'];
const ratingKeys = ['aparencia','cheiro','gosto','queima','stoned'];
const ratingLabels = { aparencia:'Aparência', cheiro:'Cheiro', gosto:'Gosto', queima:'Queima', stoned:'Stoned' };

let selectedType = '', deleteId = null, editId = null, statsPeriod = 'week', allEntries = [];
let selectedFlavors = new Set(), selectedPos = new Set(), selectedNeg = new Set();
let ratings = { aparencia:0, cheiro:0, gosto:0, queima:0, stoned:0 };

const typeStyle = {
  'Sativa': { bg:'#1a2a0a', color:'#a8e060', border:'#4a7a10' },
  'Indica': { bg:'#0a1a2a', color:'#60a8e0', border:'#1060a8' },
  'Híbrida': { bg:'#2a1a0a', color:'#e0a860', border:'#a86010' },
};

function buildTags(id, items, set, cls) {
  const el = document.getElementById(id);
  items.forEach(item => {
    const t = document.createElement('div');
    t.className = 'tag ' + cls; t.textContent = item;
    t.onclick = () => { set.has(item) ? set.delete(item) : set.add(item); t.classList.toggle('selected'); };
    el.appendChild(t);
  });
}
buildTags('flavors', flavors, selectedFlavors, 'flavor');
buildTags('pos-effects', posEffects, selectedPos, 'positive');
buildTags('neg-effects', negEffects, selectedNeg, 'negative');

function buildRatings() {
  ratingKeys.forEach(key => {
    const container = document.getElementById('r-' + key);
    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('div');
      btn.className = 'star-btn'; btn.textContent = i; btn.dataset.val = i;
      btn.onclick = () => { ratings[key] = i; updateStars(key); updateOverall(); };
      container.appendChild(btn);
    }
  });
}
buildRatings();

function updateStars(key) {
  document.querySelectorAll(`#r-${key} .star-btn`).forEach(b => b.classList.toggle('active', parseInt(b.dataset.val) === ratings[key]));
}
function updateOverall() {
  const vals = ratingKeys.map(k => ratings[k]).filter(v => v > 0);
  document.getElementById('overall-display').textContent = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : '—';
}
function calcPrice() {
  const qty = parseFloat(document.getElementById('qty').value);
  const price = parseFloat(document.getElementById('price').value);
  document.getElementById('price-per-g').textContent = (qty > 0 && price > 0) ? '€' + (price/qty).toFixed(2) + '/g' : '—';
}
function selectType(el, val) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active'); selectedType = val;
}
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'list') loadEntries();
  if (tab === 'stats') renderStats();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
async function apiRequest(method, path, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/strains${path||''}`, {
    method,
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': method === 'POST' ? 'return=representation' : '' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(await res.text());
  return method === 'GET' ? res.json() : res;
}
async function loadEntries() {
  const el = document.getElementById('entries-list');
  el.innerHTML = '<div class="loading">carregando...</div>';
  try {
    allEntries = await apiRequest('GET', '?order=created_at.desc');
    updateTabBadge(allEntries.length);
    renderCards(allEntries, el);
  } catch(err) {
    el.innerHTML = '<div class="empty">Erro ao carregar.<span>' + err.message + '</span></div>';
  }
}
function renderCards(entries, el) {
  if (!entries.length) { el.innerHTML = '<div class="empty">Nenhuma strain ainda.<span>Adiciona a primeira em Nova Strain.</span></div>'; return; }
  el.innerHTML = entries.map(e => {
    const ts = typeStyle[e.type] || {};
    const meta = [e.shop, e.qty ? e.qty+'g' : '', e.price ? '€'+parseFloat(e.price).toFixed(2) : '', e.price_per_g ? '€'+parseFloat(e.price_per_g).toFixed(2)+'/g' : ''].filter(Boolean).join(' · ');
    const flavTags = (e.flavors||[]).map(f=>`<span class="card-tag" style="background:#1a1030;color:#a090e0;border-color:#6050b0">${f}</span>`).join('');
    const posTags = (e.pos||[]).map(f=>`<span class="card-tag" style="background:#0e2010;color:#70c070;border-color:#306030">${f}</span>`).join('');
    const negTags = (e.neg||[]).map(f=>`<span class="card-tag" style="background:#2a0e0e;color:#e07070;border-color:#a03030">${f}</span>`).join('');
    const r = e.ratings || {};
    const rVals = ratingKeys.map(k=>r[k]).filter(v=>v>0);
    const overall = rVals.length ? (rVals.reduce((a,b)=>a+b,0)/rVals.length).toFixed(1) : null;
    const ratingsHtml = ratingKeys.filter(k=>r[k]>0).map(k=>`<span class="card-rating-item">${ratingLabels[k]} <span>${r[k]}</span></span>`).join('');
    const safeName = e.strain.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="entry-card">
      <div class="card-top">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="card-name">${e.strain}</span>
          ${e.type?`<span class="type-badge" style="background:${ts.bg};color:${ts.color};border-color:${ts.border}">${e.type}</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="card-date">${new Date(e.created_at).toLocaleDateString('pt-BR')}</span>
          <button class="edit-btn" onclick="openEdit(${e.id})" title="Editar">✎</button>
          <button class="delete-btn" onclick="openModal(${e.id},'${safeName}')">✕</button>
        </div>
      </div>
      ${meta?`<div class="card-meta">${meta}</div>`:''}
      ${flavTags||posTags||negTags?`<div class="card-tags">${flavTags}${posTags}${negTags}</div>`:''}
      ${ratingsHtml||overall?`<div class="card-ratings">${ratingsHtml}${overall?`<span class="card-overall">${overall}</span>`:''}</div>`:''}
      ${e.notes?`<div class="card-notes">${e.notes}</div>`:''}
    </div>`;
  }).join('');
}
function updateTabBadge(count) {
  document.getElementById('tab-list').innerHTML = `Todas as Strains <span class="count-badge">${count}</span>`;
}
function openModal(id, name) {
  deleteId = id;
  document.getElementById('modal-strain-name').textContent = `"${name}" será apagada permanentemente.`;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); deleteId = null; }
async function confirmDelete() {
  if (!deleteId) return;
  try {
    await apiRequest('DELETE', `?id=eq.${deleteId}`);
    closeModal(); showToast('Entrada apagada.'); loadEntries();
  } catch(err) { showToast('Erro ao apagar.'); }
}
function openEdit(id) {
  const e = allEntries.find(x => x.id === id);
  if (!e) return;
  editId = id;
  resetForm();
  document.getElementById('strain').value = e.strain || '';
  document.getElementById('shop').value = e.shop || '';
  document.getElementById('qty').value = e.qty != null ? e.qty : '';
  document.getElementById('price').value = e.price != null ? e.price : '';
  calcPrice();
  if (e.type) {
    const btn = [...document.querySelectorAll('.type-btn')].find(b => b.textContent.trim() === e.type);
    if (btn) { btn.classList.add('active'); selectedType = e.type; }
  }
  (e.flavors||[]).forEach(f => {
    selectedFlavors.add(f);
    [...document.querySelectorAll('#flavors .tag')].find(t => t.textContent === f)?.classList.add('selected');
  });
  (e.pos||[]).forEach(f => {
    selectedPos.add(f);
    [...document.querySelectorAll('#pos-effects .tag')].find(t => t.textContent === f)?.classList.add('selected');
  });
  (e.neg||[]).forEach(f => {
    selectedNeg.add(f);
    [...document.querySelectorAll('#neg-effects .tag')].find(t => t.textContent === f)?.classList.add('selected');
  });
  const r = e.ratings || {};
  ratingKeys.forEach(k => { ratings[k] = r[k] || 0; updateStars(k); });
  updateOverall();
  document.getElementById('notes').value = e.notes || '';
  document.getElementById('edit-banner').style.display = 'flex';
  document.getElementById('save-btn').textContent = 'Salvar edição';
  switchTab('add');
}
function cancelEdit() {
  editId = null;
  resetForm();
  document.getElementById('edit-banner').style.display = 'none';
  document.getElementById('save-btn').textContent = 'Salvar Strain';
}
async function saveEntry() {
  const strain = document.getElementById('strain').value.trim();
  if (!strain) { showToast('Coloca o nome da strain!'); return; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const qty = parseFloat(document.getElementById('qty').value) || null;
  const price = parseFloat(document.getElementById('price').value) || null;
  const price_per_g = (qty && price) ? parseFloat((price/qty).toFixed(2)) : null;
  const body = {
    strain, shop: document.getElementById('shop').value.trim()||null,
    qty, price, price_per_g, type: selectedType||null,
    flavors:[...selectedFlavors], pos:[...selectedPos], neg:[...selectedNeg],
    ratings: Object.fromEntries(ratingKeys.map(k=>[k, ratings[k]||null])),
    notes: document.getElementById('notes').value.trim()||null,
  };
  try {
    if (editId) {
      await apiRequest('PATCH', `?id=eq.${editId}`, body);
      showToast('Strain atualizada!');
      editId = null;
      document.getElementById('edit-banner').style.display = 'none';
    } else {
      await apiRequest('POST', '', body);
      showToast('Strain salva!');
    }
    resetForm(); switchTab('list');
  } catch(err) { showToast('Erro: ' + err.message); }
  finally { btn.disabled = false; btn.textContent = 'Salvar Strain'; }
}
function resetForm() {
  ['strain','shop','qty','price','notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('price-per-g').textContent = '—';
  document.getElementById('overall-display').textContent = '—';
  selectedType = ''; selectedFlavors.clear(); selectedPos.clear(); selectedNeg.clear();
  ratingKeys.forEach(k => { ratings[k] = 0; updateStars(k); });
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
}
function setStatsPeriod(el, period) {
  document.querySelectorAll('.stats-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active'); statsPeriod = period; renderStats();
}
function renderStats() {
  const el = document.getElementById('stats-content');
  if (!allEntries.length) { el.innerHTML = '<div class="empty">Sem dados ainda.</div>'; return; }
  const now = new Date();
  const filtered = allEntries.filter(e => {
    const d = new Date(e.created_at);
    if (statsPeriod === 'week') { const w = new Date(now); w.setDate(now.getDate()-7); return d >= w; }
    if (statsPeriod === 'month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
    return d.getFullYear()===now.getFullYear();
  });
  const totalGasto = filtered.reduce((a,e)=>a+(parseFloat(e.price)||0),0);
  const totalGramas = filtered.reduce((a,e)=>a+(parseFloat(e.qty)||0),0);
  const avgPpg = totalGramas > 0 ? (totalGasto/totalGramas).toFixed(2) : null;
  const withRatings = filtered.filter(e=>e.ratings&&ratingKeys.some(k=>e.ratings[k]>0));
  const topStrains = withRatings.map(e=>{
    const vals = ratingKeys.map(k=>e.ratings[k]).filter(v=>v>0);
    return { name:e.strain, overall:(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) };
  }).sort((a,b)=>b.overall-a.overall).slice(0,5);
  const shopCount = {};
  filtered.forEach(e=>{ if(e.shop) shopCount[e.shop]=(shopCount[e.shop]||0)+1; });
  const topShops = Object.entries(shopCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-card-label">Gasto total</div><div class="stat-card-value">€${totalGasto.toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-card-label">Gramas</div><div class="stat-card-value">${totalGramas.toFixed(1)}<span>g</span></div></div>
      <div class="stat-card"><div class="stat-card-label">Entradas</div><div class="stat-card-value">${filtered.length}</div></div>
      <div class="stat-card"><div class="stat-card-label">Preço médio/g</div><div class="stat-card-value">${avgPpg?'€'+avgPpg:'—'}</div></div>
    </div>
    ${topStrains.length?`<div class="stat-card"><div class="stat-card-label" style="margin-bottom:12px">Top strains por nota</div>${topStrains.map(s=>`<div class="ranking-item"><span class="ranking-name">${s.name}</span><span class="ranking-val">${s.overall}</span></div>`).join('')}</div>`:''}
    ${topShops.length?`<div class="stat-card" style="margin-top:10px"><div class="stat-card-label" style="margin-bottom:12px">Coffeeshops mais visitados</div>${topShops.map(([shop,count])=>`<div class="ranking-item"><span class="ranking-name">${shop}</span><span class="ranking-val">${count}x</span></div>`).join('')}</div>`:''}
  `;
}
loadEntries();
</script>
</body>
</html>
